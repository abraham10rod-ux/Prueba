<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming de Video - Mapa Conceptual Interactivo</title>
    <!-- Librería Vis.js para generar el grafo interactivo -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #ffffff;
        }
        header {
            text-align: center;
            padding: 20px;
            background-color: #1e293b;
            border-bottom: 2px solid #334155;
        }
        h1 {
            margin: 0;
            font-size: 24px;
            color: #38bdf8;
        }
        #network-container {
            width: 100%;
            height: calc(100vh - 80px);
            background-color: #0f172a;
        }
    </style>
</head>
<body>

<header>
    <h1>FUNDAMENTOS: STREAMING DE VIDEO</h1>
</header>

<div id="network-container"></div>

<script>
    // Definir los nodos del flujo de Streaming de Video
    const nodes = new vis.DataSet([
        { id: 1, label: "📹 FUENTE DE VIDEO\nCámara / Dispositivo de captura\nGenera datos de video en crudo", group: "source" },
        { id: 2, label: "⚙️ CODIFICADOR\nCompresión de video\n(Ej. H.264, H.265, DASH)", group: "process" },
        { id: 3, label: "🛜 RED DE DISTRIBUCIÓN (CDN)\nInternet y servidores perimetrales\nMenor latencia, alcance global", group: "core" },
        { id: 4, label: "💻 CLIENTE (REPRODUCTOR)\nBuffering, Decodificación y Renderizado\nMuestra el video al usuario", group: "client" },
        { id: 5, label: "📜 PROTOCOLOS\nRTSP, RTMP, HLS, DASH\nCrean segmentos comprimidos", group: "info" },
        { id: 6, label: "📊 COMPONENTES CLAVE\nLatencia, Ancho de banda (Bandwidth)\ny Buffer", group: "info" }
    ]);

    // Definir las conexiones del flujo
    const edges = new vis.DataSet([
        { from: 1, to: 2, arrows: 'to', color: { color: '#38bdf8' } },
        { from: 2, to: 3, arrows: 'to', color: { color: '#38bdf8' } },
        { from: 3, to: 4, arrows: 'to', color: { color: '#38bdf8' } },
        { from: 5, to: 2, arrows: 'to' },
        { from: 5, to: 3, arrows: 'to' },
        { from: 4, to: 6, arrows: 'to' }
    ]);

    const container = document.getElementById('network-container');
    const data = { nodes: nodes, edges: edges };
    
    const options = {
        nodes: {
            shape: 'box',
            margin: 14,
            widthConstraint: { maximum: 260 },
            font: { size: 14, color: '#ffffff', multi: true },
            borderWidth: 2,
            shadow: true
        },
        edges: {
            width: 2,
            color: { color: '#64748b' },
            smooth: { type: 'cubicBezier' }
        },
        groups: {
            source: {
                color: { background: '#0f2942', border: '#38bdf8', highlight: { background: '#1e3a5f', border: '#7dd3fc' } }
            },
            process: {
                color: { background: '#1e1b4b', border: '#6366f1', highlight: { background: '#312e81', border: '#818cf8' } }
            },
            core: {
                color: { background: '#1e293b', border: '#0284c7', highlight: { background: '#334155', border: '#38bdf8' } }
            },
            client: {
                color: { background: '#064e3b', border: '#10b981', highlight: { background: '#065f46', border: '#34d399' } }
            },
            info: {
                color: { background: '#451a03', border: '#f59e0b', highlight: { background: '#78350f', border: '#fbbf24' } }
            }
        },
        physics: {
            enabled: false
        },
        layout: {
            hierarchical: {
                direction: 'DOWN',
                sortMethod: 'directed',
                nodeSpacing: 160,
                levelSeparation: 100
            }
        }
    };

    const network = new vis.Network(container, data, options);
</script>

</body>
</html>
